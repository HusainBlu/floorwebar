<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR Minimal Test</title>

    <!-- Stable Pair: A-Frame 1.4.2 + MindAR 1.2.5 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiError: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="120000">
        <!-- Path matches your Netlify models/ folder -->
        <a-asset-item id="buildingModel" src="./models/building.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" intensity="1.5"></a-light>
      <a-light type="directional" position="2 4 3" intensity="1.5"></a-light>

      <!-- Floor Plan Target (Index 0) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Position Y=0.15 offsets up toward the upper floor plan zone -->
        <!-- Rotation 90 0 0 stands the model upright on top of the card -->
        <a-gltf-model
          src="#buildingModel"
          position="0 0.15 0"
          rotation="90 0 0"
          scale="0.05 0.05 0.05">
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
